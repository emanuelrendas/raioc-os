# RAIOC OS — GitHub Actions CI Gate
# MISSION-005: Reproducible Build & CI Gate
#
# Trigger: every push and pull request targeting main
# Gate: install (frozen lock) → build (sync-site-pages) → test:ci (frozen mission suites)
#
# test:ci covers:
#   - MISSION-002: security-mission2-hardening.test.js  (auth, deleted endpoints)
#   - MISSION-003: schema-provenance-mission3.test.js   (write-path schema)
#   - MISSION-004: frontend-source-of-truth-mission4.test.js + vercel-entrypoint.test.js
#
# Explicitly excluded from CI:
#   - test:smoke  (requires live Supabase/SMTP secrets — never run in CI)
#
# MISSION-016 correction to the note that stood here:
#   This file previously recorded two known-failing suites as the exclusion. The
#   real figure on main at 2026-09-05 was 31 failing suites and 101 failing tests
#   out of 539. Running only the nine passing suites made CI green while roughly a
#   fifth of the suite was broken and unwatched.
#
#   test:ci is kept as the fast credential-free gate. test:health now runs the FULL
#   suite against tests/known-failing-suites.json, a reviewable baseline with a
#   root cause on every entry, and fails the build when a suite outside that
#   baseline breaks or the failure count rises. Known debt is visible and can only
#   shrink. Triage of the baseline is tracked separately; none of the recorded
#   failures indicate broken production code — they are tests left behind by the
#   auth hardening and by routes that moved.
#
# Owner: Emanuel Rendas (Principal Advisor)
# Risk Tier: Tier 1 — Mandatory gate before main branch changes reach production

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js (from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (frozen lockfile)
        run: npm ci

      - name: Build — sync site-pages.js bundle (MISSION-004 Decision B gate)
        run: npm run build

      - name: Test — frozen mission suites (credential-free)
        run: npm run test:ci

      - name: Test health — full suite against the recorded baseline
        run: npm run test:health

      - name: Report
        if: always()
        run: |
          echo "================================"
          echo "RAIOC OS CI Gate Summary"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "================================"
          echo "Known-failing suites on record:"
          node -e "const b=require('./tests/known-failing-suites.json');console.log('  suites:',b.suites.length,'| failing tests:',b.totals.fail,'of',b.totals.tests);"
